name: Build SPLS Recorder (FOSS only)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Also publish the APKs to GitHub Releases'
        type: boolean
        default: false
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project zip (first run only)
        run: |
          if [ ! -f gradlew ]; then
            ZIP=$(find . -name '*.zip' -not -path './.git/*' | head -n1)
            if [ -z "$ZIP" ]; then
              echo "ERROR: no project files and no .zip found. Upload khpalGps.zip to the repository first."
              exit 1
            fi
            echo "Using $ZIP"
            mkdir -p /tmp/unz
            unzip -q -o "$ZIP" -d /tmp/unz
            SRC=$(dirname "$(find /tmp/unz -maxdepth 3 -name gradlew | head -n1)")
            rsync -a --exclude='.github' "$SRC"/ ./
            rm -f "$ZIP"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A -f
            git commit -m "Add KHPAL GPS project files"
            git push
          fi

      - name: Apply update zip
        run: |
          ZIP=$(find . -name 'SPLS_Recorder-update.zip' -not -path './.git/*' | head -n1)
          if [ -n "$ZIP" ]; then
            echo "Using $ZIP"
            rm -rf /tmp/upd && mkdir -p /tmp/upd
            unzip -q -o "$ZIP" -d /tmp/upd
            SRC=$(dirname "$(find /tmp/upd -maxdepth 3 -name gradlew | head -n1)")
            rsync -a --exclude='.github' "$SRC"/ ./
            rm -f "$ZIP"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A -f
            git commit -m "Apply KHPAL GPS update"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Prepare
        run: |
          touch local.properties
          echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" >> local.properties
          chmod +x ./gradlew

      - name: Run SPLS accuracy self-checks
        run: ./gradlew testFossDebugUnitTest --stacktrace

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          echo "KEYSTORE_FILE=${{ github.workspace }}/release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build FOSS APK
        run: ./gradlew assembleFossRelease --stacktrace


      - name: Collect APKs
        run: |
          mkdir -p out
          VER=$(grep "def tagName" app/build.gradle | sed -E "s/.*'([^']+)'.*/\1/")
          echo "APP_VERSION=$VER" >> $GITHUB_ENV
          find app/build/outputs/apk/foss -name '*.apk' -exec cp {} "out/SPLS-Recorder-${VER}-foss.apk" \;
          ls -la out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SPLS-Recorder-FOSS-apk
          path: out/*.apk

      # 1. PUBLISH APKs AND RELEASE NOTES TO THE PUBLIC REPO
      - name: Publish Release to Public Repo
        if: false
        uses: softprops/action-gh-release@v2
        with:
          repository: DeveloperZb-MK/khpalGps-releases
          tag_name: v${{ env.APP_VERSION }}
          name: KHPAL GPS ${{ env.APP_VERSION }}
          body_path: RELEASE_NOTES.md
          files: out/*.apk
          token: ${{ secrets.CUSTOM_RELEASE_TOKEN }}

      # 2. COPY README AND NOTICE TO THE PUBLIC REPO'S MAIN PAGE
      - name: Copy README and NOTICE to Public Repo
        if: ${{ inputs.publish_release }}
        run: |
          git clone https://x-access-token:${{ secrets.CUSTOM_RELEASE_TOKEN }}@github.com/DeveloperZb-MK/khpalGps-releases.git public-repo
          
          # Copy README
          cp README.md public-repo/README.md
          
          # Copy NOTICE (checks for exact name or .txt version to be safe)
          if [ -f NOTICE ]; then cp NOTICE public-repo/NOTICE; fi
          if [ -f NOTICE.txt ]; then cp NOTICE.txt public-repo/NOTICE.txt; fi
          
          cd public-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          # The || exit 0 prevents an error if there are no changes to commit
          git commit -m "Update README and NOTICE for version ${{ env.APP_VERSION }}" || exit 0
          git push
          
