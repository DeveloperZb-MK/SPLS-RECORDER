name: Build SPLS Recorder (FOSS only)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Also publish the APKs to GitHub Releases'
        type: boolean
        default: false
  push:
    branches: [ main, cleanup/map-only-screen ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project zip (first run only)
        run: |
          if [ ! -f gradlew ]; then
            ZIP=$(find . -name '*.zip' -not -path './.git/*' | head -n1)
            if [ -z "$ZIP" ]; then
              echo "ERROR: no project files and no .zip found. Upload khpalGps.zip to the repository first."
              exit 1
            fi
            echo "Using $ZIP"
            mkdir -p /tmp/unz
            unzip -q -o "$ZIP" -d /tmp/unz
            SRC=$(dirname "$(find /tmp/unz -maxdepth 3 -name gradlew | head -n1)")
            rsync -a --exclude='.github' "$SRC"/ ./
            rm -f "$ZIP"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A -f
            git commit -m "Add KHPAL GPS project files"
            git push
          fi

      - name: Apply update zip
        run: |
          ZIP=$(find . -name 'SPLS_Recorder-update.zip' -not -path './.git/*' | head -n1)
          if [ -n "$ZIP" ]; then
            echo "Using $ZIP"
            rm -rf /tmp/upd && mkdir -p /tmp/upd
            unzip -q -o "$ZIP" -d /tmp/upd
            SRC=$(dirname "$(find /tmp/upd -maxdepth 3 -name gradlew | head -n1)")
            rsync -a --exclude='.github' "$SRC"/ ./
            rm -f "$ZIP"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A -f
            git commit -m "Apply KHPAL GPS update"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Prepare
        run: |
          touch local.properties
          chmod +x ./gradlew

      - name: Run SPLS unit tests
        run: ./gradlew testFossDebugUnitTest --stacktrace

      # FOSS debug build: always debug-signed; no release keystore is read or used.
      - name: Build FOSS debug APK
        run: ./gradlew assembleFossDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          VER=$(grep "def tagName" app/build.gradle | sed -E "s/.*'([^']+)'.*/\\1/")
          echo "APP_VERSION=$VER" >> $GITHUB_ENV
          find app/build/outputs/apk/foss/debug -name '*.apk' -exec cp {} "out/SPLS-Recorder-${VER}-debug.apk" \;
          test -s "out/SPLS-Recorder-${VER}-debug.apk"
          ls -la out

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPLS-Recorder-debug-apk
          path: out/*.apk

      - name: Publish debug APK to GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: SPLS Recorder ${{ env.APP_VERSION }} (Debug)
          body: |
            Debug-signed FOSS build of SPLS Recorder.
            This APK is signed with the standard Android debug key and is intended for testing.
          files: out/*.apk

