name: Validate map-only cleanup

on:
  push:
    branches: [ cleanup/map-only-screen ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
      - name: Prepare Gradle
        run: chmod +x ./gradlew
      - name: Build FOSS debug APK
        run: ./gradlew assembleFossDebug --stacktrace
      - name: Build Full debug APK
        run: ./gradlew assembleFullDebug --stacktrace
