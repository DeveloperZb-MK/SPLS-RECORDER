name: Validate map-only cleanup

on:
  push:
    branches: [ cleanup/map-only-screen ]
  workflow_dispatch:

concurrency:
  group: foss-cleanup-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
      - name: Prepare Gradle
        run: chmod +x ./gradlew
      - name: Build FOSS debug APK
        run: ./gradlew --no-daemon assembleFossDebug --stacktrace
